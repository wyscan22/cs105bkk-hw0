# Runs the tests in this repo every time you push, so you can see the result on GitHub
# (the Actions tab). It is feedback for you, not your grade.
name: tests

on:
  push:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run the tests
        run: python -m pytest -v
